name: Beyblade Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: beyblade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Beyblade Monitor
        run: |
          python monitor.py

      - name: Save product status and web page
        if: always()
        run: |
          if [ -f seen_products.json ] || [ -f index.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if [ -f seen_products.json ]; then
              git add seen_products.json
            fi

            if [ -f index.html ]; then
              git add index.html
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Update Beyblade monitor results"
              git pull --rebase
              git push
            else
              echo "No product or page changes."
            fi
          else
            echo "No output files were generated."
          fi

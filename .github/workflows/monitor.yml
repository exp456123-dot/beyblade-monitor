name: Beyblade Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: beyblade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Beyblade Monitor
        run: python monitor.py

      - name: Save product status
        run: |
          if [ -f seen_products.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add seen_products.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Beyblade product status"
              git push
            else
              echo "No product status changes."
            fi
          fi
